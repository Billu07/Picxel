name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Third-party actions are pinned to commit SHAs (supply-chain safety); Dependabot keeps them current.
jobs:
  quality:
    name: Lint, format, types, import contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run --frozen ruff check --output-format=github .
      - run: uv run --frozen ruff format --check .
      - run: uv run --frozen mypy
      - run: uv run --frozen lint-imports

  test:
    name: Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: picxel
          POSTGRES_PASSWORD: picxel
          POSTGRES_DB: picxel_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U picxel -d picxel_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      PICXEL_TEST_DATABASE_URL: postgresql://picxel:picxel@127.0.0.1:5432/picxel_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run --frozen pytest --cov --cov-report=term-missing:skip-covered

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      - name: Export production dependencies
        run: uv export --locked --no-default-groups --no-emit-project --format requirements-txt > requirements.txt
      - name: Audit for known vulnerabilities
        run: uvx pip-audit --strict --require-hashes --disable-pip -r requirements.txt

  container:
    name: Container build, smoke test, scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: picxel:ci
          build-args: |
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test
        run: |
          docker run --detach --name picxel --publish 8080:8080 --env PICXEL_ENV=test picxel:ci
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8080/api/v1/health; then
              curl --fail --silent --output /dev/null http://127.0.0.1:8080/
              curl --fail --silent --output /dev/null http://127.0.0.1:8080/static/css/app.css
              exit 0
            fi
            sleep 1
          done
          docker logs picxel
          exit 1
      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: picxel:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
