# Install once: `uv run pre-commit install`
# Python tools run through uv, so hooks use exactly the versions pinned in uv.lock (same as CI).
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        exclude: \.md$
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: ["--fix=lf"]
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=500"]
      - id: detect-private-key

  - repo: local
    hooks:
      - id: uv-lock
        name: uv lockfile is current
        entry: uv lock --check
        language: system
        files: ^(pyproject\.toml|uv\.lock)$
        pass_filenames: false
      - id: ruff-check
        name: ruff check
        entry: uv run --frozen ruff check --fix
        language: system
        types_or: [python]
      - id: ruff-format
        name: ruff format
        entry: uv run --frozen ruff format
        language: system
        types_or: [python]
      - id: mypy
        name: mypy
        entry: uv run --frozen mypy
        language: system
        types_or: [python]
        pass_filenames: false
      - id: import-linter
        name: import contracts
        entry: uv run --frozen lint-imports
        language: system
        types_or: [python]
        pass_filenames: false
