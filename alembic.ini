# Alembic configuration. The database URL comes from PICXEL_DATABASE_URL (see migrations/env.py).
# New revision: uv run alembic revision --autogenerate --rev-id 0002 -m "add analyses table"

[alembic]
script_location = %(here)s/migrations
file_template = %%(rev)s_%%(slug)s
prepend_sys_path = .
path_separator = os
