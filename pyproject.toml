[project]
name = "picxel"
version = "0.1.0"
description = "See what's really in your pixels: an open-source AI-image inspector and platform export studio."
readme = "README.md"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Autolinium" }]
requires-python = "==3.12.*"
classifiers = [
    "Private :: Do Not Upload",
    "Framework :: FastAPI",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "alembic>=1.20.0",
    "fastapi>=0.141.1",
    "jinja2>=3.1.6",
    "psycopg[binary]>=3.3.5",
    "pydantic-settings>=2.15.0",
    "sqlalchemy>=2.0.52",
    "uvicorn[standard]>=0.53.0",
]

[project.scripts]
picxel = "app.cli:main"

[project.urls]
Homepage = "https://picxel.autolinium.com"
Repository = "https://github.com/Billu07/Picxel"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[dependency-groups]
dev = [
    "httpx2>=2.13.0",
    "import-linter>=2.15",
    "mypy>=2.3.1",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.7",
]
assets = [
    "pytailwindcss>=0.3.1",
]

[tool.uv]
default-groups = ["dev", "assets"]

# ---------------------------------------------------------------------------
# Ruff: lint + format
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "N",        # pep8-naming
    "UP",       # pyupgrade
    "B",        # bugbear
    "S",        # bandit (security)
    "SIM",      # simplify
    "C4",       # comprehensions
    "PT",       # pytest style
    "RET",      # return statements
    "RUF",      # ruff-specific
    "ASYNC",    # async pitfalls
    "DTZ",      # timezone-aware datetimes
    "T20",      # no print()
    "PTH",      # pathlib over os.path
    "FAST",     # FastAPI conventions
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]
"app/cli.py" = ["T201", "S603", "S607"]
"migrations/versions/**" = ["N999", "F401"]

# ---------------------------------------------------------------------------
# Mypy: strict everywhere we own code
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
files = ["app", "tests"]
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
warn_required_dynamic_aliases = true

# ---------------------------------------------------------------------------
# Import contracts: architecture boundaries (project.md §6)
# ---------------------------------------------------------------------------
[tool.importlinter]
root_package = "app"

[[tool.importlinter.contracts]]
name = "Studio never imports detection code (D-001 guardrail)"
type = "forbidden"
source_modules = ["app.studio"]
forbidden_modules = ["app.inspector"]

[[tool.importlinter.contracts]]
name = "Layered architecture (project.md §6)"
type = "layers"
layers = [
    "app.cli",
    "app.main",
    "app.factory",
    "app.errors",
    "app.api | app.web",
    "app.inspector | app.studio",
    "app.imaging | app.db",
    "app.core",
]

# ---------------------------------------------------------------------------
# Tests & coverage
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
markers = ["db: needs PostgreSQL (set PICXEL_TEST_DATABASE_URL)"]
filterwarnings = [
    "error",
    # Starlette 1.6's TestClient still touches a deprecated anyio alias. Remove once Starlette updates.
    "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning",
]

[tool.coverage.run]
branch = true
source = ["app"]
omit = ["app/cli.py"]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError"]
